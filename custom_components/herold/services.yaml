    label:
      example: Arbeit
      selector:
        text:
    message:
      example: "Guten Morgen! Zeit aufzustehen."
      selector:
        text:
          multiline: true
    urgency:
      example: normal
      selector:
        select:
          options:
            - gentle
            - normal
            - insistent
    sound_mode:
      example: builtin
      selector:
        select:
          options:
            - builtin
            - media
            - music_assistant
            - announce
    sound:
      example: chime
      selector:
        text:
    sound_media_type:
      example: playlist
      selector:
        select:
          options:
            - track
            - album
            - artist
            - playlist
            - radio
    announce:
      selector:
        boolean:
    voice_snooze:
      selector:
        boolean:
    routine:
      example: script.guten_morgen
      selector:
        entity:
          domain:
            - script
            - scene
