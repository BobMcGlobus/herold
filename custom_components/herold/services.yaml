alarm_skip_next:
  fields:
    id:
      required: true
      example: a1b2c3d4
      selector:
        text:

alarm_cancel:
  fields:
    id:
      required: true
      example: a1b2c3d4
      selector:
        text:

alarm_snooze:
  fields:
    id:
      example: a1b2c3d4
      selector:
        text:
    minutes:
      example: 9
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: min

alarm_dismiss:
  fields:
    id:
      example: a1b2c3d4
      selector:
        text:

alarm_test:
  fields:
    id:
      example: a1b2c3d4
      selector:
        text:
    scope:
      required: true
      default: sound
      selector:
        select:
          options:
            - sound
            - light
            - cover
            - all
    volume:
      required: true
      default: 0.4
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
    seconds:
      example: 12
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: s

alarm_search_media:
  fields:
    query:
      required: true
      example: Morning Playlist
      selector:
        text:
    media_type:
      example: playlist
      selector:
        select:
          options:
            - track
            - album
            - artist
            - playlist
            - radio
    limit:
      example: 8
      selector:
        number:
          min: 1
          max: 25

dnd_on:
  fields:
    until:
      example: "+1h"
      selector:
        text:
    until_home:
      default: false
      selector:
        boolean:

dnd_off:
  fields: {}
