send:
  fields:
    message:
      example: "Die Waschmaschine ist fertig"
      selector:
        text:
          multiline: true
    priority:
      required: true
      default: 2
      selector:
        number:
          min: 0
          max: 4
          mode: slider
    recipient:
      selector:
        entity:
          domain: person
    target_player:
      selector:
        entity:
          domain:
            - assist_satellite
            - media_player
    title:
      selector:
        text:
    tag:
      selector:
        text:
    ttl_minutes:
      selector:
        number:
          min: 0
          max: 1440
    callback_event:
      example: "AI_CONFIRM"
      selector:
        text:
    template:
      example: "appliance_done"
      selector:
        text:
    template_vars:
      example: '{"appliance": "Waschmaschine"}'
      selector:
        object:
    ignore_rate_limit:
      default: false
      selector:
        boolean:

query:
  fields:
    question:
      required: true
      example: "Soll ich das Licht ausschalten?"
      selector:
        text:
          multiline: true
    mode:
      required: true
      default: yesno
      selector:
        select:
          options:
            - yesno
            - open
            - choice
    choices:
      example: "Ja, Nein, Später"
      selector:
        text:
          multiple: true
    priority:
      required: true
      default: 2
      selector:
        number:
          min: 0
          max: 4
          mode: slider
    callback_event:
      default: "AI_CONFIRM"
      selector:
        text:
    timeout_minutes:
      default: 60
      selector:
        number:
          min: 1
          max: 1440
    voice_timeout_seconds:
      example: 90
      selector:
        number:
          min: 10
          max: 3600
          unit_of_measurement: "s"
    default_answer:
      example: "Nein"
      selector:
        text:
    escalation:
      example: '[{"after_minutes": 5, "raise_to_priority": 3}]'
      selector:
        object:
    recipient:
      selector:
        entity:
          domain: person
    target_player:
      selector:
        entity:
          domain:
            - assist_satellite
            - media_player

acknowledge:
  fields:
    id:
      required: true
      example: "a1b2c3d4"
      selector:
        text:
    answer:
      required: true
      example: "Ja"
      selector:
        text:
    source:
      example: "ui"
      selector:
        text:

cancel:
  fields:
    id:
      required: true
      example: "a1b2c3d4"
      selector:
        text:
    reason:
      example: "Nicht mehr relevant"
      selector:
        text:

schedule:
  fields:
    scheduled_for:
      required: true
      example: "+1h30m"
      selector:
        text:
    message:
      required: true
      example: "Ofen vorheizen nicht vergessen"
      selector:
        text:
          multiline: true
    priority:
      required: true
      default: 2
      selector:
        number:
          min: 0
          max: 4
          mode: slider
    recipient:
      selector:
        entity:
          domain: person
    target_player:
      selector:
        entity:
          domain:
            - assist_satellite
            - media_player
    title:
      selector:
        text:
    tag:
      selector:
        text:
    task_context:
      example: "Der Kuchen soll um 18 Uhr aus dem Ofen."
      selector:
        text:
          multiline: true

remind_self:
  fields:
    when:
      required: true
      example: "+30m"
      selector:
        text:
    instruction:
      required: true
      example: "Frage den User via herold.query: Wie ist der Kuchen geworden?"
      selector:
        text:
          multiline: true
    task_context:
      example: "Es backt gerade ein Kuchen, Rückmeldung in 30 min gewünscht."
      selector:
        text:
          multiline: true

watch:
  fields:
    entity_id:
      required: true
      example: binary_sensor.haustuer_kontakt
      selector:
        entity:
    message:
      required: true
      example: Denk an das Paket für den Postboten!
      selector:
        text:
          multiline: true
    to_state:
      example: "on"
      selector:
        text:
    from_state:
      example: "off"
      selector:
        text:
    above:
      selector:
        number:
          min: -100
          max: 1000
          step: 0.1
          mode: box
    below:
      selector:
        number:
          min: -100
          max: 1000
          step: 0.1
          mode: box
    priority:
      required: true
      default: 2
      selector:
        number:
          min: 0
          max: 4
          mode: slider
    ttl_hours:
      default: 72
      selector:
        number:
          min: 0
          max: 8760
          unit_of_measurement: h
    title:
      selector:
        text:
    task_context:
      selector:
        text:
          multiline: true

alarm_set:
  fields:
    time:
      required: true
      example: "07:00"
      selector:
        time:
    key:
      example: schichtplan
      selector:
        text:
    days:
      example: "mon, tue, wed, thu, fri"
      selector:
        select:
          multiple: true
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
    label:
      example: Arbeit
      selector:
        text:
    message:
      example: "Guten Morgen! Zeit aufzustehen."
      selector:
        text:
          multiline: true
    urgency:
      example: normal
      selector:
        select:
          options:
            - gentle
            - normal
            - insistent
    sound_mode:
      example: builtin
      selector:
        select:
          options:
            - builtin
            - media
            - music_assistant
            - announce
    sound:
      example: chime
      selector:
        text:
    sound_media_type:
      example: playlist
      selector:
        select:
          options:
            - track
            - album
            - artist
            - playlist
            - radio
    announce:
      selector:
        boolean:
    voice_snooze:
      selector:
        boolean:
    routine:
      example: script.guten_morgen
      selector:
        entity:
          domain:
            - script
            - scene
            - automation
    workday_only:
      selector:
        boolean:
    valid_until:
      example: "+7d"
      selector:
        text:
    enabled:
      selector:
        boolean:

